<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sono em dupla</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13141b">
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f6;--tx:#14151c;--mut:#666a79;--sheet:#fff;--line:#d8dbe5;--pill:#e1e4ee;
--card:#13141b;--ctx:#f1f2f6;--cmut:#8b8e9c;--empty:#292b36;--c1:#e5484d;--c2:#2f7a5c;--c3:#3fbf7f;--c4:#9bf2c0;--c5:#f5a54a;--ac:#3fd6a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0b0f;--tx:#f1f2f6;--mut:#8b8e9c;--sheet:#1b1c25;--line:#2a2c37;--pill:#181a22}}
:root[data-theme="dark"]{--bg:#0a0b0f;--tx:#f1f2f6;--mut:#8b8e9c;--sheet:#1b1c25;--line:#2a2c37;--pill:#181a22}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Jost',system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:22px 16px 56px}
h1{font-weight:200;font-size:34px;line-height:1.1;margin:6px 0 4px;letter-spacing:.01em}
.sub{color:var(--mut);margin:0 0 18px;font-size:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--pill);padding:5px;border-radius:18px;margin-bottom:14px}
.tab{font:inherit;font-size:18px;font-weight:400;border:0;border-radius:14px;background:transparent;color:var(--mut);padding:12px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.tab i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:500;color:#0b0c10}
.tab small{font-size:12px;opacity:.75}
.tab[aria-selected="true"]{background:var(--card);color:var(--ctx)}
.vs{border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.vs h2{font-weight:400;font-size:16px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:78px 1fr 62px;align-items:center;gap:10px;margin:7px 0;font-size:15px}
.bar .t{height:10px;background:var(--pill);border-radius:6px;overflow:hidden}
.bar .t b{display:block;height:100%;border-radius:6px}
.bar span:last-child{text-align:right;font-weight:300;font-size:17px}
.vs p{margin:10px 0 0;color:var(--mut);font-size:15px}
.card{background:var(--card);color:var(--ctx);border-radius:22px;padding:20px 18px 16px;border-top:3px solid var(--ac)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.yr{display:flex;align-items:center;gap:8px}
.yr b{font-weight:200;font-size:48px;line-height:1}
.nav{background:none;border:1px solid #333646;color:var(--ctx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.who{text-align:right;color:var(--cmut);font-size:15px;line-height:1.3}
.who b{display:block;color:var(--ac);font-weight:400;font-size:18px}
.scroll{overflow-x:auto;margin-top:16px;padding-bottom:8px}
.wrap{position:relative;width:max-content;padding-top:18px}
.months{position:absolute;top:0;left:0;height:14px}
.months span{position:absolute;font-size:11px;color:var(--cmut)}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:4px}
.d{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--empty);cursor:pointer}
.d.ph{background:none;pointer-events:none}
.d.fut{opacity:.3;cursor:default}
.d.t{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--ctx)}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}
.d:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #7aa7ff;outline-offset:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:13px;color:var(--cmut)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-weight:300;font-size:28px}
.stat span{color:var(--mut);font-size:14px}
.perf{margin:14px 0 0;padding:14px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:0 14px 14px 0;font-size:16px;line-height:1.45}
.foot{margin-top:18px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot button{font:inherit;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:0}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.veil.on{display:flex}
.sheet{background:var(--sheet);color:var(--tx);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:560px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-weight:400;font-size:20px;margin:0 0 4px}
.sheet p.n{color:var(--mut);font-size:14px;margin:0 0 16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:14px;color:var(--mut)}
input[type=time]{width:100%;margin-top:6px;font:inherit;font-size:22px;font-weight:300;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx)}
input:disabled{opacity:.8}
.res{margin:16px 0;padding:14px;border-radius:14px;border:1px solid var(--line)}
.res b{font-weight:300;font-size:32px;display:block}
.res span{color:var(--mut);font-size:15px;line-height:1.4}
.goal{height:6px;background:var(--pill);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.goal i{display:block;height:100%;background:var(--c3)}
.btns{display:flex;gap:8px}
.btns button{flex:1;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
.btns .pri{background:var(--c3);border-color:var(--c3);color:#06140d;font-weight:500}
.btns .del{flex:0 0 auto;color:var(--c1)}
.pick button{display:block;width:100%;font:inherit;font-size:20px;padding:16px;margin-top:10px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222431;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<main>
  <h1>Sono em dupla</h1>
  <p class="sub">Cada um registra o seu e vê o do outro.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="vs" id="vs"></section>
  <section class="card" id="card">
    <div class="head">
      <div class="yr"><button class="nav" id="prev" aria-label="Ano anterior">‹</button><b id="year"></b><button class="nav" id="next" aria-label="Próximo ano">›</button></div>
      <div class="who"><b id="wname"></b><span id="count"></span></div>
    </div>
    <div class="scroll" id="scroll"><div class="wrap"><div class="months" id="months"></div><div class="grid" id="grid"></div></div></div>
    <div class="leg">Horas dormidas
      <span><i class="b1"></i>menos de 6h</span><span><i class="b2"></i>6h</span><span><i class="b3"></i>7h</span><span><i class="b4"></i>8h</span><span><i class="b5"></i>9h+</span>
    </div>
  </section>
  <div class="stats">
    <div class="stat"><b id="avg">–</b><span>média do ano</span></div>
    <div class="stat"><b id="good">–</b><span>noites com 7h+</span></div>
    <div class="stat"><b id="streak">0</b><span>seguidas com 7h+</span></div>
  </div>
  <p class="perf" id="perf"></p>
  <div class="foot"><span id="mode"></span><button id="swap" type="button">Trocar de pessoa</button></div>
</main>

<div class="veil" id="veil">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <h2 id="st"></h2>
    <p class="n" id="sn">A noite conta no dia em que você acordou.</p>
    <div class="row">
      <label>Dormiu às<input type="time" id="bed" value="23:00"></label>
      <label>Acordou às<input type="time" id="wake" value="07:00"></label>
    </div>
    <div class="res" id="resb"><b id="rd"></b><div class="goal"><i id="gl"></i></div><span id="rf"></span></div>
    <div class="btns"><button class="del" id="del" type="button">Apagar</button><button id="close" type="button">Fechar</button><button class="pri" id="save" type="button">Salvar</button></div>
  </div>
</div>

<div class="veil" id="pick"><div class="sheet pick"><h2>Quem é você?</h2><p class="n">Assim o app abre direto na sua aba.</p>
  <button type="button" data-p="gabriel">Sou o Gabriel</button><button type="button" data-p="matheus">Sou o Matheus</button></div></div>
<div class="toast" id="toast"></div>

<script>
var P={gabriel:{n:'Gabriel',c:'#3fd6a3'},matheus:{n:'Matheus',c:'#a594ff'}};
var D={gabriel:{},matheus:{}},db=null,canW=true,me=null,tab='gabriel',sel=null,loaded={},Q={gabriel:Promise.resolve(),matheus:Promise.resolve()};
var $=function(id){return document.getElementById(id)};
try{me=localStorage.getItem('sono:me')}catch(e){}
if(!P[me])me=null;
if(me)tab=me;
['gabriel','matheus'].forEach(function(p){try{D[p]=JSON.parse(localStorage.getItem('sono:v2:'+p)||'{}')||{}}catch(e){}});
var today=new Date();today.setHours(0,0,0,0);
var year=today.getFullYear();
var MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dur(b,w){var x=b.split(':').map(Number),y=w.split(':').map(Number);var m=(y[0]*60+y[1])-(x[0]*60+x[1]);if(m<=0)m+=1440;return m/60}
function bucket(h){return h<6?1:h<7?2:h<8?3:h<9?4:5}
function fmt(h){var m=Math.round(h*60);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')}
function hrs(p,k){var e=D[p][k];return e?dur(e.b,e.w):null}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3500)}
function feedback(h){
  if(h<5)return 'Muito pouco. Foco e humor costumam cair no dia seguinte.';
  if(h<6)return 'Abaixo do ideal. Tente dormir mais cedo hoje.';
  if(h<7)return 'Quase lá. Mais 30 a 60 minutos já fazem diferença.';
  if(h<8)return 'Boa noite de sono, dentro da meta.';
  if(h<9)return 'Ótima noite. Recuperação completa.';
  return 'Sono longo. Se for frequente, vale observar a qualidade.';
}
function save(p){
  try{localStorage.setItem('sono:v2:'+p,JSON.stringify(D[p]))}catch(e){}
  if(!db)return;
  var snap=JSON.parse(JSON.stringify(D[p]));
  Q[p]=Q[p].then(function(){return db.doc('sono/'+p).set({entries:snap})}).catch(function(){toast('Não consegui sincronizar. Tente salvar de novo.')});
}
function streak(p){
  var s=0,d=new Date(today);
  for(var i=0;i<400;i++){var h=hrs(p,iso(d));
    if(h===null){if(i===0){d.setDate(d.getDate()-1);continue}break}
    if(h>=7)s++;else break;d.setDate(d.getDate()-1)}
  return s;
}
function week(p){
  var t=0,n=0;
  for(var i=0;i<7;i++){var d=new Date(today);d.setDate(d.getDate()-i);var h=hrs(p,iso(d));if(h!==null){t+=h;n++}}
  return n?t/n:null;
}
function renderTabs(){
  $('tabs').innerHTML=['gabriel','matheus'].map(function(p){
    return '<button class="tab" role="tab" data-p="'+p+'" aria-selected="'+(p===tab)+'"><i style="background:'+P[p].c+'">'+P[p].n[0]+'</i>'+P[p].n+(p===me?' <small>(você)</small>':'')+'</button>';
  }).join('');
}
function renderVS(){
  var a=week('gabriel'),b=week('matheus'),h='<h2>Últimos 7 dias</h2>';
  ['gabriel','matheus'].forEach(function(p){var v=p==='gabriel'?a:b;
    h+='<div class="bar"><span>'+P[p].n+'</span><span class="t"><b style="width:'+(v?Math.min(v/9,1)*100:0)+'%;background:'+P[p].c+'"></b></span><span>'+(v?fmt(v):'–')+'</span></div>'});
  if(a!==null&&b!==null){
    var df=Math.round(Math.abs(a-b)*60),w=a>b?'gabriel':'matheus',l=w==='gabriel'?'matheus':'gabriel';
    h+='<p>'+(df<10?'Empate: vocês dormem quase igual.':P[w].n+' dorme '+df+' min a mais por noite que '+P[l].n+'.')+'</p>';
  }else h+='<p>Quando os dois tiverem registros, a comparação aparece aqui.</p>';
  $('vs').innerHTML=h;
}
function render(){
  var p=tab;
  document.documentElement.style.setProperty('--ac',P[p].c);
  renderTabs();renderVS();
  $('year').textContent=year;
  $('next').disabled=year>=today.getFullYear();
  $('wname').textContent=P[p].n;
  var first=new Date(year,0,1),off=first.getDay();
  var n=((year%4===0&&year%100!==0)||year%400===0)?366:365,html='',cnt=0,tot=0,good=0;
  for(var i=0;i<off;i++)html+='<span class="d ph"></span>';
  for(var d=0;d<n;d++){
    var dt=new Date(year,0,1+d),k=iso(dt),h=hrs(p,k),fut=dt>today;
    var c='d'+(h!==null?' b'+bucket(h):'')+(fut?' fut':'')+(dt.getTime()===today.getTime()?' t':'');
    if(h!==null){cnt++;tot+=h;if(h>=7)good++}
    html+='<button class="'+c+'" data-k="'+k+'"'+(fut?' disabled':'')+' aria-label="'+dt.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})+(h!==null?', '+fmt(h):', sem registro')+'"></button>';
  }
  $('grid').innerHTML=html;
  var ml='';
  for(var m=0;m<12;m++){var doy=Math.round((new Date(year,m,1)-first)/864e5);ml+='<span style="left:'+Math.floor((off+doy)/7)*16+'px">'+MES[m]+'</span>'}
  $('months').innerHTML=ml;
  $('count').textContent=cnt+(cnt===1?' noite':' noites')+' em '+year;
  $('avg').textContent=cnt?fmt(tot/cnt):'–';
  $('good').textContent=cnt?Math.round(good/cnt*100)+'%':'–';
  $('streak').textContent=streak(p);
  var ks=Object.keys(D[p]).sort().slice(-7),pf=$('perf');
  if(!ks.length)pf.textContent=(p===me?'Registre sua primeira noite':P[p].n+' ainc não registrou nenhuma noite').replace('ainc','ainda')+(p===me?' para ver seu desempenho.':'.');
  else{var a=ks.reduce(function(t,k){return t+hrs(p,k)},0)/ks.length;
    pf.textContent='Últimos '+ks.length+(ks.length===1?' registro':' registros')+': média de '+fmt(a)+'. '+(a>=8?'Sono excelente. Mantenha a rotina.':a>=7?'Dentro da meta de 7h ou mais. Continue assim.':a>=6?'Perto da meta. Dormir 30 minutos mais cedo já ajuda.':'Está dormindo pouco. Vale priorizar dormir mais cedo esta semana.')}
  $('mode').textContent=!db?'Modo local: o banco ainda não foi configurado, os dados ficam só neste aparelho.':(canW?(p===me?'Você pode editar esta aba.':'Aba de '+P[p].n+': somente leitura.'):'Você só tem permissão para ver.');
}
function edit(){return tab===me&&canW&&!!db}
function upd(){
  var h=dur($('bed').value||'23:00',$('wake').value||'07:00');
  $('rd').textContent=fmt(h);$('gl').style.width=Math.min(h/8,1)*100+'%';$('rf').textContent=feedback(h);
}
function openSheet(k){
  sel=k;var q=k.split('-').map(Number),dt=new Date(q[0],q[1]-1,q[2]),e=D[tab][k],ed=edit()||(!db&&tab===me)||(!db);
  ed=!db?true:edit();
  $('st').textContent=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('sn').textContent=ed?'A noite conta no dia em que você acordou.':'Noite de '+P[tab].n+' (somente leitura).';
  $('bed').value=e?e.b:'23:00';$('wake').value=e?e.w:'07:00';
  $('bed').disabled=$('wake').disabled=!ed;
  $('save').style.display=ed?'':'none';$('del').style.display=ed&&e?'':'none';
  $('resb').style.display=(ed||e)?'':'none';
  upd();$('veil').classList.add('on');
  if(!ed&&!e){$('resb').style.display='';$('rd').textContent='Sem registro';$('gl').style.width='0';$('rf').textContent='Essa noite ainda não foi registrada.'}
}
function closeSheet(){$('veil').classList.remove('on');sel=null}
function who(){return db?tab:tab}
$('tabs').addEventListener('click',function(ev){var b=ev.target.closest('.tab');if(b){tab=b.dataset.p;render()}});
$('grid').addEventListener('click',function(ev){var b=ev.target.closest('.d[data-k]');if(b&&!b.disabled)openSheet(b.dataset.k)});
$('bed').addEventListener('input',upd);$('wake').addEventListener('input',upd);
$('save').addEventListener('click',function(){if(!sel)return;D[tab][sel]={b:$('bed').value||'23:00',w:$('wake').value||'07:00'};save(tab);closeSheet();render()});
$('del').addEventListener('click',function(){if(!sel)return;delete D[tab][sel];save(tab);closeSheet();render()});
$('close').addEventListener('click',closeSheet);
$('veil').addEventListener('click',function(e){if(e.target===this)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
$('prev').addEventListener('click',function(){year--;render()});
$('next').addEventListener('click',function(){if(year<today.getFullYear()){year++;render()}});
$('swap').addEventListener('click',function(){$('pick').classList.add('on')});
$('pick').addEventListener('click',function(ev){var b=ev.target.closest('button[data-p]');if(!b)return;
  me=b.dataset.p;tab=me;try{localStorage.setItem('sono:me',me)}catch(e){}
  $('pick').classList.remove('on');migrate(me);render()});
function migrate(p){
  if(!db||!loaded[p]||Object.keys(D[p]).length)return;
  var old=null;try{old=JSON.parse(localStorage.getItem('sono:v1')||'null')}catch(e){}
  if(old&&Object.keys(old).length){D[p]=old;save(p);try{localStorage.removeItem('sono:v1')}catch(e){}}
}
function scrollToday(){
  var off=new Date(year,0,1).getDay(),doy=Math.round((today-new Date(year,0,1))/864e5),sc=$('scroll');
  sc.scrollLeft=Math.max(0,Math.floor((off+doy)/7)*16-sc.clientWidth/2);
}
render();scrollToday();
if(!me)$('pick').classList.add('on');
var firebaseConfig={
  apiKey:"AIzaSyDV8xWQy4LbGKTIqDEARqYt58aFbeiRG9I",
  authDomain:"sono-dupla.firebaseapp.com",
  projectId:"sono-dupla",
  storageBucket:"sono-dupla.firebasestorage.app",
  messagingSenderId:"449296819644",
  appId:"1:449296819644:web:21420783fb56366e5ab7b9"
};
(function(){
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  var ok=firebaseConfig.projectId&&firebaseConfig.projectId!=='COLE_AQUI'&&window.firebase;
  if(!ok){db=null;render();return}
  try{
    firebase.initializeApp(firebaseConfig);
    var fs=firebase.firestore();
    db={doc:function(path){var r=fs.doc(path);return{
      set:function(d){return r.set(d)},
      onSnapshot:function(n,e){return r.onSnapshot(function(s){n({exists:s.exists,data:function(){return s.data()}})},e)}
    }}};
  }catch(e){db=null;render();return}
  ['gabriel','matheus'].forEach(function(p){
    db.doc('sono/'+p).onSnapshot(function(s){
      var v=s.exists&&s.data()&&s.data().entries;
      D[p]=v||{};loaded[p]=true;
      try{localStorage.setItem('sono:v2:'+p,JSON.stringify(D[p]))}catch(e){}
      if(p===me)migrate(p);
      render();
    },function(){toast('Sem conexão com o banco. Mostrando dados salvos no aparelho.');db=null;render()});
  });
  render();
})();
</script>
</body>
</html>
